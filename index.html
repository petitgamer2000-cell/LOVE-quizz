<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: bgShift 4s ease infinite;
        }

        @keyframes bgShift {
            0%, 100% { background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%); }
            50% { background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%); }
        }

        .container {
            text-align: center;
            background: white;
            padding: 4rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            animation: popIn 0.6s ease-out;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 3rem;
            color: #ff1493;
            margin-bottom: 2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .question {
            font-size: 2rem;
            color: #333;
            margin-bottom: 3rem;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #yesBtn {
            background: #4CAF50;
            color: white;
            padding: 1rem 3rem;
        }

        #yesBtn:hover {
            background: #45a049;
            transform: scale(1.1);
        }

        #noBtn {
            background: #f44336;
            color: white;
            position: relative;
        }

        #noBtn:hover {
            background: #da190b;
        }

        .success {
            display: none;
            margin-top: 2rem;
            font-size: 2rem;
            color: #4CAF50;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hearts {
            font-size: 3rem;
            margin-top: 1rem;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💕</h1>
        <div class="question">Do you love me?</div>
        
        <div class="buttons">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>

        <div class="success">
            <div>YES! I LOVE YOU! 💕💕💕</div>
            <div class="hearts">💕 💕 💕</div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const successMsg = document.querySelector('.success');

        // Bouton YES
        yesBtn.addEventListener('click', function() {
            successMsg.style.display = 'block';
            noBtn.style.display = 'none';
            yesBtn.style.display = 'none';
        });

        // Bouton NO - qui bouge et s'échappe
        noBtn.addEventListener('mouseover', function() {
            const randomX = (Math.random() - 0.5) * 400;
            const randomY = (Math.random() - 0.5) * 300;
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        });

        // Sur mobile, le bouton bouge au toucher aussi
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            const randomX = (Math.random() - 0.5) * 400;
            const randomY = (Math.random() - 0.5) * 300;
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        });

        // Augmente la taille du bouton YES à chaque tentative de clic sur NO
        noBtn.addEventListener('click', function() {
            const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            yesBtn.style.fontSize = (currentSize + 10) + 'px';
            yesBtn.style.padding = (currentSize * 1.5) + 'px ' + (currentSize * 2.5) + 'px';
        });
    </script>
</body>
</html>
